name: what_to_eat
description: 今日吃什么 —— 本地优先的菜谱抽签 App（Flutter + Riverpod + GoRouter + Drift）
publish_to: 'none'
version: 1.6.0+7

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # 状态管理（手动 Provider，不依赖代码生成）
  flutter_riverpod: ^2.5.1

  # 路由
  go_router: ^14.2.7

  # 本地数据库（SQLite，需要 build_runner 生成 .g.dart）
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # 数据导入/导出（V1 备份/恢复/迁移，仅用 file_picker 同时支持存盘与选文件）
  # 锁 ^8.0.0：兼容 Flutter >=3.22 / Dart >=3.4（share_plus 13.x 要求 Flutter >=3.38 会冲突）
  file_picker: ^8.0.0

  # 动画（结果卡展开）
  flutter_animate: ^4.5.0

  # 音效（竹筒摇晃 / 签条揭示）
  audioplayers: ^6.1.0

  # 图片选择（菜谱自定义图片上传）
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # 仅 Drift 使用代码生成
  build_runner: ^2.4.0
  drift_dev: ^2.21.0

  # 应用图标（AI 生成源图 → 各平台尺寸）
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/seed/
    - assets/sounds/
    - assets/icons/

flutter_launcher_icons:
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#F7F3EA"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  android: "ic_launcher"
  ios: false
